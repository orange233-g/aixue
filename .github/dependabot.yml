version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # onnxruntime-web 固定为与 src/assets/ort.min.mjs 匹配的构建版本，升级需人工核对 wasm
      - dependency-name: onnxruntime-web

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
